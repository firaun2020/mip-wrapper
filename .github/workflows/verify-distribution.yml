name: Verify Distribution

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build helper and wheel
        shell: pwsh
        run: |
          dotnet publish native/MipWrapper.Helper/MipWrapper.Helper.csproj --configuration Release --runtime win-x64 --self-contained true --output runtime/win-x64
          python -m pip install --upgrade build setuptools wheel
          python tools/build_distribution.py --platform win-x64 --runtime-dir runtime/win-x64 --output-dir dist
      - name: Clean install and protocol smoke test
        shell: pwsh
        run: |
          $wheel = (Get-ChildItem dist\*.whl | Select-Object -First 1).FullName
          $venv = Join-Path $env:RUNNER_TEMP "mip-wrapper-venv"
          python -m venv $venv
          $python = Join-Path $venv "Scripts\python.exe"
          & $python -m pip install $wheel
          & $python -m pip install pytest
          Push-Location $env:RUNNER_TEMP
          try {
            $env:MIP_WRAPPER_EXPECT_PACKAGED_RUNTIME = "1"
            & $python -c "import mip_wrapper; print('version=', mip_wrapper.__version__); from mip_wrapper import MipClient; c=object.__new__(MipClient); print('helper=', c._find_packaged_helper())"
            $helper = & $python -c "from mip_wrapper import MipClient; print(object.__new__(MipClient)._find_packaged_helper())"
            Write-Host "installed helper path: $helper"
            Get-FileHash $helper -Algorithm SHA256
            & $python -c "import json,subprocess; from mip_wrapper import MipClient; helper=object.__new__(MipClient)._find_packaged_helper(); process=subprocess.Popen([str(helper)], stdin=subprocess.PIPE, stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True); process.stdin.write('{}\n'); process.stdin.flush(); response=json.loads(process.stdout.readline()); print('helper response:', response); assert response['success'] is False; assert response['error']['code'] in {'InvalidRequest', 'UnsupportedProtocolVersion'}; process.terminate(); process.wait(timeout=10)"
            & $python -m pip check
            & $python -m pytest "$env:GITHUB_WORKSPACE\tests"
          } finally {
            Pop-Location
          }
      - name: Report wheel
        shell: pwsh
        run: |
          Get-ChildItem dist\*.whl | Select-Object Name,Length

  ubuntu:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build helper and wheel
        run: |
          set -o pipefail
          dotnet publish native/MipWrapper.Helper/MipWrapper.Helper.csproj --configuration Release --runtime linux-x64 --self-contained true --output runtime/ubuntu-22.04-x64 2>&1 | tee dotnet-publish.log
          echo 'Ubuntu2204 NuGet package contents:'
          find "$HOME/.nuget/packages/microsoft.informationprotection.file.ubuntu2204/1.18.124" -type f -printf '%P\n' | sort
          echo 'NU1701 conclusion: Microsoft.InformationProtection.File.Ubuntu2204 exposes lib/dotnet assets but no net10.0 target; the warning is retained and not suppressed.'
          python -m pip install --upgrade build setuptools wheel
          chmod +x runtime/ubuntu-22.04-x64/MipWrapper.Helper
          python tools/build_distribution.py --platform ubuntu-22.04-x64 --runtime-dir runtime/ubuntu-22.04-x64 --output-dir dist
      - name: Clean install and helper smoke test
        run: |
          set -euo pipefail
          wheel=$(find dist -name '*.whl' -print -quit)
          venv="$RUNNER_TEMP/mip-wrapper-venv"
          python -m venv "$venv"
          python_bin="$venv/bin/python"
          "$python_bin" -m pip install "$wheel"
          "$python_bin" -m pip install pytest
          export MIP_WRAPPER_EXPECT_PACKAGED_RUNTIME=1
          cd "$RUNNER_TEMP"
          "$python_bin" - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path
          from unittest.mock import patch
          import mip_wrapper
          from mip_wrapper import MipClient, MissingRuntimeError

          print('version=', mip_wrapper.__version__)
          client = object.__new__(MipClient)
          helper = client._find_packaged_helper()
          print('helper=', helper)
          assert Path(helper).is_file()
          assert os.access(helper, os.X_OK)

          process = subprocess.Popen([str(helper)], stdin=subprocess.PIPE, stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True)
          try:
              process.stdin.write('{}\n')
              process.stdin.flush()
              response = json.loads(process.stdout.readline())
              print('helper response:', response)
              assert response['success'] is False
              assert response['error']['code'] in {'InvalidRequest', 'UnsupportedProtocolVersion'}
          finally:
              process.terminate()
              process.wait(timeout=10)

          with patch('mip_wrapper.client.platform.system', return_value='Linux'), patch('mip_wrapper.client.platform.machine', return_value='x86_64'), patch.object(Path, 'exists', return_value=True), patch.object(Path, 'read_text', return_value='ID=mariner\nVERSION_ID="2.0"\n'):
              try:
                  client._find_packaged_helper()
              except MissingRuntimeError as error:
                  assert error.error_code == 'UnsupportedPlatform'
                  print('mariner guard: rejected')
              else:
                  raise AssertionError('Mariner was accepted')
          PY
          "$python_bin" -m pip check
          "$python_bin" -m pytest "$GITHUB_WORKSPACE/tests"
      - name: Audit Linux wheel and shared libraries
        run: |
          set -euo pipefail
          wheel=$(find dist -name '*.whl' -print -quit)
          python -m pip install --upgrade auditwheel
          auditwheel show "$wheel"
          venv="$RUNNER_TEMP/mip-wrapper-venv"
          runtime="$venv/lib/python3.13/site-packages/mip_wrapper/_runtime/ubuntu-22.04-x64"
          helper="$runtime/MipWrapper.Helper"
          echo "ldd $helper"
          ldd "$helper" 2>&1 | tee helper-ldd.txt || true
          if grep -q 'not found' helper-ldd.txt; then exit 1; fi
          while IFS= read -r library; do
            echo "ldd $library"
            ldd "$library" 2>&1 | tee -a so-ldd.txt
          done < <(find "$runtime" -type f -name '*.so' -print)
          if grep -q 'not found' so-ldd.txt; then exit 1; fi
          test -x "$helper"
      - name: Report wheel
        run: |
          find dist -name '*.whl' -printf '%f %s bytes\n'
